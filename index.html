<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Demo</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 id="main-heading">DOM Manipulation Demo</h1>
    </header>
    
    <main>
        <section class="content-section">
            <p id="dynamic-text">This text will change when you click the button below.</p>
            <button id="text-changer">Change Text Content</button>
        </section>
        
        <section class="content-section">
            <div id="style-demo" class="box">This box will change color.</div>
            <button id="style-changer">Modify Styles</button>
        </section>
        
        <section class="content-section">
            <div id="element-container">
                <p>Existing element</p>
            </div>
            <button id="toggle-element">Toggle Element</button>
        </section>
    </main>
    
    <footer>
        <p>© 2023 DOM Manipulation Example</p>
    </footer>
</body>
</html>
